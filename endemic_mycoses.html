<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infectious Diseases Consult: The RPG</title>
    <style>
        /* --- CSS VARIABLES & THEMING --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --accent-warning: #f59e0b;
            --border-radius: 12px;
            --font-ui: 'Courier New', Courier, monospace;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition-speed: 0.3s;
        }

        /* --- GLOBAL STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- TOP DASHBOARD (STATS) --- */
        .dashboard {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            font-family: var(--font-ui);
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-group { display: flex; gap: 15px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 1.25rem; font-weight: bold; }
        
        .stat.knowledge .stat-value { color: var(--accent-blue); }
        .stat.stress .stat-value { color: var(--accent-red); }
        .stat.fatigue .stat-value { color: var(--accent-warning); }
        .stat.reputation .stat-value { color: var(--accent-purple); }
        .stat.streak .stat-value { color: var(--accent-green); }

        .btn-coffee {
            background: transparent;
            border: 1px solid var(--accent-warning);
            color: var(--accent-warning);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-ui);
            transition: all var(--transition-speed);
        }
        .btn-coffee:hover { background: var(--accent-warning); color: var(--bg-color); }

        /* --- CONSULT CARD --- */
        .consult-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid #334155;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .badge-difficulty {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            font-family: var(--font-ui);
        }
        .diff-student { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .diff-pgy1 { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .diff-pgy2 { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
        .diff-attending { background: rgba(245, 158, 11, 0.2); color: var(--accent-warning); border: 1px solid var(--accent-warning); }
        .diff-legendary { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }

        .category-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* --- MULTIPLE CHOICE OPTIONS --- */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover { background: #334155; border-color: var(--accent-blue); }
        .option-btn.selected { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-blue); }
        
        .option-btn.correct { background: rgba(34, 197, 94, 0.1); border-color: var(--accent-green); color: var(--accent-green); }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.1); border-color: var(--accent-red); color: var(--accent-red); }

        .submit-container {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-action {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #0284c7; }
        .btn-action:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        /* --- EXPLANATION SECTION --- */
        .explanation-section {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #334155;
            animation: slideIn 0.3s ease-out;
        }
        .explanation-section.active { display: block; }

        .result-banner {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .result-correct { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .result-wrong { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .rationale { font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; color: #cbd5e1; }
        .references {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }

        /* --- ANALYTICS MODAL --- */
        #analytics-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .analytics-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 600px;
            border: 1px solid var(--accent-blue);
        }
        .analytics-content h2 { margin-bottom: 20px; color: var(--accent-blue); }

        /* --- UTILS --- */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app">
    <div class="dashboard">
        <div class="stat-group">
            <div class="stat knowledge">
                <span class="stat-label">Knowledge</span>
                <span class="stat-value" id="ui-knowledge">0</span>
            </div>
            <div class="stat reputation">
                <span class="stat-label">Reputation</span>
                <span class="stat-value" id="ui-reputation">Neutral</span>
            </div>
            <div class="stat streak">
                <span class="stat-label">Streak</span>
                <span class="stat-value" id="ui-streak">0</span>
            </div>
        </div>
        <div class="stat-group">
            <div class="stat stress">
                <span class="stat-label">Stress</span>
                <span class="stat-value" id="ui-stress">0%</span>
            </div>
            <div class="stat fatigue">
                <span class="stat-label">Fatigue</span>
                <span class="stat-value" id="ui-fatigue">0%</span>
            </div>
            <button class="btn-coffee" id="btn-coffee" onclick="game.drinkCoffee()">
                ☕ Coffee (<span id="ui-coffee">3</span>)
            </button>
        </div>
    </div>

    <div class="consult-card">
        <div class="card-header">
            <div class="category-label" id="ui-category">Loading Consult...</div>
            <div class="badge-difficulty" id="ui-difficulty">--</div>
        </div>
        
        <div class="question-text" id="ui-question">
            Awaiting pager...
        </div>

        <div class="options-container" id="ui-options">
            </div>

        <div class="submit-container">
            <button class="btn-action" id="btn-submit" onclick="game.submitAnswer()" disabled>Submit Assessment</button>
            <button class="btn-action hidden" id="btn-next" onclick="game.nextEncounter()">Next Consult</button>
        </div>

        <div class="explanation-section" id="ui-explanation-box">
            <div class="result-banner" id="ui-result-banner"></div>
            <div class="rationale" id="ui-rationale"></div>
            <div class="references" id="ui-references"></div>
        </div>
    </div>
    
    <div style="text-align: center;">
        <button class="btn-coffee" style="border-color: #334155; color: #94a3b8;" onclick="game.showAnalytics()">View Shift Analytics</button>
        <button class="btn-coffee" style="border-color: #334155; color: #94a3b8;" onclick="game.resetData()">Reset Data</button>
    </div>
</div>

<div id="analytics-modal">
    <div class="analytics-content">
        <h2>End of Shift Report</h2>
        <div id="analytics-stats" style="margin-bottom: 20px; line-height: 1.6;"></div>
        <button class="btn-action" onclick="document.getElementById('analytics-modal').style.display='none'">Close</button>
    </div>
</div>

<script>
/**
 * ---------------------------------------------------------
 * QUESTION BANK
 * Designed for easy copy/paste of hundreds of objects.
 * Sourced strictly from the provided IDSA guidelines context.
 * ---------------------------------------------------------
 */
const questionBank = [
    {
        id: "q1_histo_tx",
        category: "Histoplasmosis – Treatment Recommendations",
        difficulty: "Student",
        question: "According to the 2025 IDSA guidelines, what is the preferred antifungal agent for the treatment of mild to moderate acute pulmonary histoplasmosis when treatment is indicated? [cite: 1, 2]",
        answer: "Itraconazole",
        distractors: ["Fluconazole", "Liposomal amphotericin B", "Caspofungin"],
        explanation: "Itraconazole is the preferred agent for mild to moderate acute pulmonary histoplasmosis when treatment is indicated[cite: 2]. Fluconazole is less effective, and echinocandins have poor activity[cite: 17, 22].",
        references: ["Arnold SR, Spec A, Baddley JW, et al. 2025 Clinical Practice Guideline Update by the IDSA on Histoplasmosis. Clin Infect Dis. 2025;ciaf256. [cite: 3, 4]"]
    },
    {
        id: "q2_histo_immuno",
        category: "Histoplasmosis – Treatment Recommendations",
        difficulty: "PGY1",
        question: "According to the 2025 IDSA guidelines, should immunocompetent patients with mild acute pulmonary histoplasmosis routinely receive antifungal treatment? [cite: 4, 5]",
        answer: "No, routine treatment is not recommended.",
        distractors: [
            "Yes, a 6-week course of itraconazole is standard.",
            "Yes, a 3-day loading dose of fluconazole is required.",
            "No, but they should be given empirical antibiotics."
        ],
        explanation: "The 2025 IDSA guidelines suggest against routinely providing antifungal treatment for immunocompetent patients with mild acute pulmonary histoplasmosis (conditional recommendation, very low certainty of evidence)[cite: 5]. Treatment may be considered if there is prolonged illness or progressing infiltrates[cite: 6].",
        references: ["Arnold SR, Spec A, Baddley JW, et al. 2025 Clinical Practice Guideline Update by the IDSA on Histoplasmosis. Clin Infect Dis. 2025;ciaf256. [cite: 7, 8]"]
    },
    {
        id: "q3_blasto_preg",
        category: "Blastomycosis – Special Populations",
        difficulty: "PGY1",
        question: "What is the only recommended antifungal for the treatment of blastomycosis during pregnancy, and why? [cite: 44, 224]",
        answer: "Amphotericin B; because azoles are associated with congenital anomalies.",
        distractors: [
            "Fluconazole; because it is the safest azole.",
            "Itraconazole; because it has excellent placental penetration.",
            "Caspofungin; because echinocandins are highly effective."
        ],
        explanation: "Amphotericin B is the only recommended treatment. Azoles are associated with congenital anomalies and must be avoided, particularly in the first trimester[cite: 224].",
        references: ["Chapman SW, Dismukes WE, Proia LA, et al. Clinical Practice Guidelines for the Management of Blastomycosis: 2008 Update by the IDSA. Clin Infect Dis. 2008;46(12):1801-12. [cite: 44]"]
    },
    {
        id: "q4_cocci_1stline",
        category: "Coccidioidomycosis – Treatment Recommendations",
        difficulty: "Student",
        question: "What is the preferred first-line azole for the treatment of most forms of coccidioidomycosis? [cite: 45]",
        answer: "Fluconazole",
        distractors: ["Itraconazole", "Voriconazole", "Posaconazole"],
        explanation: "Fluconazole is preferred. It is predictably well absorbed, has fewer drug interactions than itraconazole, and is the least expensive azole option[cite: 45].",
        references: ["Galgiani JN, Ampel NM, Blair JE, et al. 2016 IDSA Clinical Practice Guideline for the Treatment of Coccidioidomycosis. Clin Infect Dis. 2016;63(6):e112-46. [cite: 46, 47]"]
    },
    {
        id: "q5_blasto_echino",
        category: "Blastomycosis – Antimicrobial Spectrum",
        difficulty: "Student",
        question: "Which antifungal class should NOT be used for the treatment of blastomycosis due to lack of efficacy? [cite: 37, 38]",
        answer: "Echinocandins",
        distractors: ["Polyenes", "Triazoles", "Nucleoside analogs"],
        explanation: "Echinocandins (e.g., caspofungin, micafungin, anidulafungin) have intermediate to poor in vitro activity against Blastomyces dermatitidis and should not be prescribed[cite: 38].",
        references: ["Chapman SW, Dismukes WE, Proia LA, et al. Clinical Practice Guidelines for the Management of Blastomycosis. Clin Infect Dis. 2008;46(12):1801-12. [cite: 39, 40]"]
    },
    {
        id: "q6_histo_tdm",
        category: "Histoplasmosis – Pharmacology/TDM",
        difficulty: "PGY1",
        question: "What is the goal itraconazole trough concentration recommended by the 2025 IDSA histoplasmosis guidelines? [cite: 8, 9, 158]",
        answer: ">1 mg/L and <3–4 mg/L",
        distractors: [
            ">0.5 mg/L and <2 mg/L",
            ">2 mg/L and <5 mg/L",
            ">10 mg/L"
        ],
        explanation: "The goal itraconazole trough concentration is >1 mg/L and <3–4 mg/L. Alternatively, a combined hydroxy-itraconazole and itraconazole level >2 mg/L may indicate an adequate response[cite: 9, 158, 160].",
        references: ["Arnold SR, Spec A, Baddley JW, et al. 2025 Clinical Practice Guideline Update by the IDSA on Histoplasmosis. [cite: 11]"]
    }
];

/**
 * ---------------------------------------------------------
 * GAME ENGINE CORE
 * Manages state, logic, and spaced repetition.
 * ---------------------------------------------------------
 */
const GameEngine = (() => {
    // Default State
    const defaultState = {
        stats: { knowledge: 0, fatigue: 0, stress: 0, reputation: 0, coffee: 3 },
        streak: 0,
        maxStreak: 0,
        questionsAnswered: 0,
        correctAnswers: 0,
        history: {}, // Format: { q_id: { weight: 1, lastSeen: timestamp } }
        currentQuestion: null,
        selectedAnswer: null
    };

    let state = JSON.parse(JSON.stringify(defaultState));

    // Initialize Game
    const init = () => {
        loadProgress();
        nextEncounter();
        updateUI();
    };

    // Save/Load to LocalStorage
    const saveProgress = () => localStorage.setItem('idConsultRPG', JSON.stringify(state));
    const loadProgress = () => {
        const saved = localStorage.getItem('idConsultRPG');
        if (saved) state = { ...defaultState, ...JSON.parse(saved) };
    };
    const resetData = () => {
        if(confirm("Are you sure you want to clear all progress?")) {
            localStorage.removeItem('idConsultRPG');
            state = JSON.parse(JSON.stringify(defaultState));
            init();
        }
    };

    // Helper: Determine Reputation Title
    const getReputationTitle = (rep) => {
        if (rep < -50) return "Code Brown";
        if (rep < 0) return "Needs Improvement";
        if (rep < 50) return "Neutral";
        if (rep < 150) return "Reliable Colleague";
        if (rep < 300) return "ID Stewardship Hero";
        return "Legendary Attending";
    };

    // UI Updater
    const updateUI = () => {
        document.getElementById('ui-knowledge').innerText = state.stats.knowledge;
        document.getElementById('ui-reputation').innerText = getReputationTitle(state.stats.reputation);
        document.getElementById('ui-streak').innerText = state.streak;
        document.getElementById('ui-stress').innerText = state.stats.stress + '%';
        document.getElementById('ui-fatigue').innerText = state.stats.fatigue + '%';
        document.getElementById('ui-coffee').innerText = state.stats.coffee;
        
        // Disable coffee if none left or no fatigue
        document.getElementById('btn-coffee').disabled = state.stats.coffee <= 0 || state.stats.fatigue <= 0;
    };

    // Coffee Mechanic
    const drinkCoffee = () => {
        if (state.stats.coffee > 0 && state.stats.fatigue > 0) {
            state.stats.coffee--;
            state.stats.fatigue = Math.max(0, state.stats.fatigue - 30);
            state.stats.stress = Math.max(0, state.stats.stress - 15);
            updateUI();
            saveProgress();
        }
    };

    // Spaced Repetition Logic: Pick Next Question
    const selectNextQuestion = () => {
        // Initialize weights for unseen questions
        questionBank.forEach(q => {
            if (!state.history[q.id]) {
                state.history[q.id] = { weight: 10, lastSeen: 0 }; // High weight for unseen
            }
        });

        // Filter out the immediate last question to avoid double repeats
        let candidates = questionBank.filter(q => q.id !== state.currentQuestion?.id);

        // Calculate total weight
        let totalWeight = candidates.reduce((sum, q) => sum + state.history[q.id].weight, 0);

        // Random pick based on weight
        let randomNum = Math.random() * totalWeight;
        for (let q of candidates) {
            if (randomNum < state.history[q.id].weight) {
                return q;
            }
            randomNum -= state.history[q.id].weight;
        }
        return candidates[0]; // Fallback
    };

    // Start next encounter
    const nextEncounter = () => {
        // Boss Encounter condition (mock check based on fatigue/streak)
        if (state.stats.fatigue > 80 || state.stats.stress > 80) {
            alert("⚠️ RAPID RESPONSE: Patient deteriorating. High stress detected.");
        }

        const q = selectNextQuestion();
        state.currentQuestion = q;
        state.selectedAnswer = null;

        // Update card UI
        document.getElementById('ui-category').innerText = q.category;
        
        const diffBadge = document.getElementById('ui-difficulty');
        diffBadge.innerText = q.difficulty;
        diffBadge.className = `badge-difficulty diff-${q.difficulty.toLowerCase()}`;
        
        document.getElementById('ui-question').innerText = q.question;
        
        // Hide explanation & Swap buttons
        document.getElementById('ui-explanation-box').classList.remove('active');
        document.getElementById('btn-submit').classList.remove('hidden');
        document.getElementById('btn-submit').disabled = true;
        document.getElementById('btn-next').classList.add('hidden');

        generateChoicesUI(q);
        saveProgress();
    };

    // Generate Multiple Choice UI
    const generateChoicesUI = (q) => {
        const container = document.getElementById('ui-options');
        container.innerHTML = '';

        // Combine correct answer and distractors, then shuffle
        let choices = [q.answer, ...q.distractors];
        choices = choices.sort(() => Math.random() - 0.5);

        choices.forEach(choiceText => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = choiceText;
            btn.onclick = () => selectOption(btn, choiceText);
            container.appendChild(btn);
        });
    };

    // Handle Option Selection
    const selectOption = (btnElement, text) => {
        if (document.getElementById('btn-next').classList.contains('hidden') === false) return; // Prevent changing answer after submit

        // UI toggles
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        
        state.selectedAnswer = text;
        document.getElementById('btn-submit').disabled = false;
    };

    // Evaluate Answer
    const submitAnswer = () => {
        const q = state.currentQuestion;
        const isCorrect = state.selectedAnswer === q.answer;
        
        state.questionsAnswered++;

        // Update Spaced Repetition History
        state.history[q.id].lastSeen = Date.now();

        // Process Stats
        if (isCorrect) {
            state.correctAnswers++;
            state.streak++;
            if(state.streak > state.maxStreak) state.maxStreak = state.streak;
            
            state.stats.knowledge += (10 + state.streak);
            state.stats.reputation += 15;
            state.stats.stress = Math.max(0, state.stats.stress - 5);
            
            // Decrease weight (less likely to see again soon)
            state.history[q.id].weight = Math.max(1, state.history[q.id].weight * 0.3);

            showExplanationUI(true, q);
        } else {
            state.streak = 0;
            state.stats.stress = Math.min(100, state.stats.stress + 20);
            state.stats.fatigue = Math.min(100, state.stats.fatigue + 10);
            state.stats.reputation -= 10;
            
            // Increase weight (more likely to see again)
            state.history[q.id].weight += 15;

            showExplanationUI(false, q);
        }

        // Colorize options
        document.querySelectorAll('.option-btn').forEach(b => {
            if (b.innerText === q.answer) b.classList.add('correct');
            else if (b.classList.contains('selected')) b.classList.add('wrong');
        });

        // Swap buttons
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');

        updateUI();
        saveProgress();
    };

    // Show Rationale
    const showExplanationUI = (isCorrect, q) => {
        const box = document.getElementById('ui-explanation-box');
        const banner = document.getElementById('ui-result-banner');
        
        box.classList.add('active');
        
        if (isCorrect) {
            banner.className = 'result-banner result-correct';
            banner.innerText = '✅ Clinical Decision Accepted';
        } else {
            banner.className = 'result-banner result-wrong';
            banner.innerText = '❌ Attending Intervenes';
        }

        document.getElementById('ui-rationale').innerHTML = `<strong>Rationale:</strong> ${q.explanation}`;
        document.getElementById('ui-references').innerHTML = `<strong>References:</strong><br>${q.references.join('<br>')}`;
    };

    // Analytics Dashboard
    const showAnalytics = () => {
        const accuracy = state.questionsAnswered === 0 ? 0 : Math.round((state.correctAnswers / state.questionsAnswered) * 100);
        
        let html = `
            <p><strong>Consults Completed:</strong> ${state.questionsAnswered}</p>
            <p><strong>Overall Accuracy:</strong> ${accuracy}%</p>
            <p><strong>Longest Streak:</strong> ${state.maxStreak}</p>
            <p><strong>Current Knowledge XP:</strong> ${state.stats.knowledge}</p>
            <p><strong>Reputation Status:</strong> ${getReputationTitle(state.stats.reputation)}</p>
            <hr style="margin:10px 0; border:0; border-top:1px solid #334155;">
            <p style="font-size: 0.85rem; color: #94a3b8;">*Spaced repetition algorithm active. Weak areas will be automatically prioritized in future consults.</p>
        `;
        
        document.getElementById('analytics-stats').innerHTML = html;
        document.getElementById('analytics-modal').style.display = 'flex';
    };

    // Public Methods
    return {
        init,
        drinkCoffee,
        submitAnswer,
        nextEncounter,
        showAnalytics,
        resetData
    };
