<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ID topic game</title>
<script>
  /* Shows script errors on the page (including a typo in the BANK block) instead of failing silently. */
  window.addEventListener("error", function (ev) {
    var box = document.getElementById("runtime-error");
    if (!box) return;
    box.hidden = false;
    box.textContent = "The game hit an error: " + ev.message + (ev.lineno ? " (line " + ev.lineno + ")" : "") +
      ". If you just edited the BANK block, check for a missing comma, bracket, or quotation mark, then reload.";
  });
</script>
<style>
  :root {
    color-scheme: light dark;
    --bench: #eef1f5;
    --slide: #ffffff;
    --slide-2: #f5f6fa;
    --ink: #1c2030;
    --muted: #555b6e;
    --line: #d5d9e3;
    --violet: #3b2a6b;
    --violet-soft: #ece8f6;
    --on-violet: #ffffff;
    --pink: #b8285f;
    --pink-soft: #fbe8f0;
    --s: #1b6a45;
    --s-bg: #def0e6;
    --i: #845600;
    --i-bg: #f9edcf;
    --r: #a4301d;
    --r-bg: #f8e0da;
    --focus: #b8285f;
    --radius-lg: 14px;
    --radius-sm: 8px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bench: #15121d;
      --slide: #1f1a2b;
      --slide-2: #272138;
      --ink: #ede9f5;
      --muted: #aba4bd;
      --line: #3a3350;
      --violet: #c9b8ff;
      --violet-soft: #2e2745;
      --on-violet: #1a1430;
      --pink: #ff82b4;
      --pink-soft: #3a1f30;
      --s: #82dcaa;
      --s-bg: #173226;
      --i: #f2c66b;
      --i-bg: #372c12;
      --r: #ff9d8a;
      --r-bg: #3c1e18;
      --focus: #ff82b4;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bench);
    color: var(--ink);
    font: 400 1rem/1.55 var(--font);
  }
  h1, h2, h3, h4, p { margin: 0; }
  h1, h2, h3, h4 { line-height: 1.2; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .shell { max-width: 46rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
  @media (min-width: 40rem) { .shell { padding: 2rem 1.5rem 4rem; } }
  main:focus { outline: none; }
  .muted { color: var(--muted); }
  kbd {
    font: inherit; font-size: .85em; font-weight: 700;
    padding: .05rem .4rem; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; background: var(--slide);
  }

  /* Buttons and form controls */
  .btn {
    font: inherit; font-weight: 650; line-height: 1.2;
    border-radius: 999px; padding: .7rem 1.25rem; min-height: 2.75rem;
    border: 2px solid transparent; cursor: pointer;
  }
  .btn.primary { background: var(--violet); color: var(--on-violet); }
  .btn.primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .btn.quiet { background: transparent; color: var(--violet); border-color: var(--line); }
  .btn.quiet:hover:not(:disabled) { border-color: var(--violet); }
  .btn.quiet:disabled { color: var(--muted); opacity: .55; cursor: not-allowed; }
  .btn.small { padding: .35rem .8rem; min-height: 2.25rem; font-size: .9rem; }
  select, input[type="text"], textarea {
    font: inherit; color: var(--ink); background: var(--slide);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: .55rem .7rem; min-height: 2.75rem; max-width: 100%;
  }
  label { font-weight: 650; }

  .alert {
    background: var(--r-bg); color: var(--ink); border: 1px solid var(--r);
    border-radius: var(--radius-sm); padding: .8rem 1rem; margin-bottom: 1.25rem;
  }
  .alert h2 { font-size: 1rem; color: var(--r); margin-bottom: .4rem; }
  .alert ul { margin: .25rem 0 .5rem; padding-left: 1.2rem; }

  /* Start screen */
  .hero { padding: .5rem 0 1.25rem; border-bottom: 3px solid var(--violet); margin-bottom: 1.5rem; }
  .hero h1 {
    font-size: clamp(2.1rem, 8vw, 3.2rem); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.02; color: var(--violet);
  }
  .hero .sub { font-size: clamp(1.05rem, 3.4vw, 1.3rem); font-weight: 600; margin-top: .5rem; max-width: 34ch; }
  .hero .source-line { margin-top: .9rem; color: var(--muted); max-width: 60ch; }
  .section-h { font-size: 1.1rem; font-weight: 750; margin: 0 0 .75rem; }
  .modes { display: grid; gap: .75rem; grid-template-columns: 1fr; }
  @media (min-width: 34rem) { .modes { grid-template-columns: 1fr 1fr; } }
  .mode {
    text-align: left; font: inherit; color: inherit; background: var(--slide);
    border: 1px solid var(--line); border-left: 6px solid var(--violet);
    border-radius: var(--radius-sm); padding: .9rem 1rem; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: .25rem .75rem; align-content: start;
  }
  .mode[data-mode="pearls"] { border-left-color: var(--pink); }
  .mode[data-mode="retry"] { border-left-color: var(--r); }
  .mode:hover:not(:disabled) { border-color: var(--violet); }
  .mode:disabled { cursor: not-allowed; border-left-color: var(--line); color: var(--muted); }
  .mode-name { font-weight: 750; font-size: 1.1rem; }
  .mode-count { font-size: .85rem; color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mode-desc { grid-column: 1 / -1; color: var(--muted); font-size: .93rem; }
  .settings { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
  .settings .hint { color: var(--muted); font-size: .9rem; flex-basis: 100%; }
  .how { margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--line); display: grid; gap: .75rem; }
  .how p { max-width: 62ch; }

  /* Antibiogram-style status cells (signature element) */
  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; font-size: .88rem; color: var(--muted); list-style: none; padding: 0; margin: 0; }
  .legend li { display: flex; align-items: center; gap: .4rem; }
  .cell {
    width: 1.75rem; height: 1.75rem; display: inline-grid; place-items: center;
    font-size: .74rem; font-weight: 750; border-radius: 4px;
    background: var(--slide); border: 1px solid var(--line); color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .cell-s { background: var(--s-bg); color: var(--s); border-color: var(--s); }
  .cell-i { background: var(--i-bg); color: var(--i); border-color: var(--i); }
  .cell-r { background: var(--r-bg); color: var(--r); border-color: var(--r); }
  .cell-current { border: 2px solid var(--pink); color: var(--ink); }
  .strip { display: flex; flex-wrap: wrap; gap: 3px; margin-top: .6rem; }
  .strip .cell-newround { margin-left: .55rem; }

  /* Quiz screen */
  .topbar { padding-bottom: .75rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--line); }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .mode-label { font-weight: 750; color: var(--violet); }
  .score { font-variant-numeric: tabular-nums; display: flex; gap: .8rem; align-items: baseline; margin-top: .2rem; }
  .pts { font-weight: 800; font-size: 1.15rem; }
  .streak { color: var(--pink); font-weight: 700; font-size: .92rem; }
  .item-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; margin-bottom: .75rem; }
  .qcount { font-size: .95rem; font-weight: 700; color: var(--muted); }
  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; padding: 0; }
  .chip { font-size: .8rem; padding: .15rem .6rem; border-radius: 999px; background: var(--violet-soft); color: var(--violet); }
  .stem {
    font-size: 1.1rem; line-height: 1.62; background: var(--slide);
    border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1rem 1.15rem;
  }
  .stem-case { border-top: 5px solid var(--violet); }
  .timer { display: flex; align-items: center; gap: .6rem; margin: 0 0 .75rem; }
  .timer-track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--violet); transform-origin: left center; transition: transform .25s linear; }
  .timer-low .timer-fill { background: var(--r); }
  .timer-low .timer-text { color: var(--r); }
  .timer-text { font-variant-numeric: tabular-nums; font-size: .88rem; font-weight: 700; min-width: 4.5rem; text-align: right; }

  .options { display: grid; gap: .6rem; margin-top: 1rem; }
  .option {
    display: grid; grid-template-columns: 1.9rem 1fr; gap: .2rem .75rem; align-items: start;
    text-align: left; font: inherit; color: inherit; background: var(--slide);
    border: 2px solid var(--line); border-radius: var(--radius-sm);
    padding: .75rem .9rem; cursor: pointer;
  }
  .option:not(.locked):hover { border-color: var(--violet); }
  .option-key {
    width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--line); font-weight: 750; font-size: .9rem; color: var(--muted);
  }
  .option-text { align-self: center; }
  .option.selected { border-color: var(--violet); background: var(--violet-soft); }
  .option.selected .option-key { background: var(--violet); color: var(--on-violet); border-color: var(--violet); }
  .option-mark { grid-column: 2; font-weight: 750; font-size: .88rem; }
  .option-mark:empty { display: none; }
  .option.locked { cursor: default; }
  .option.locked:not(.is-correct):not(.is-wrong) { opacity: .72; }
  .option.is-correct { border-color: var(--s); background: var(--s-bg); }
  .option.is-correct .option-key { background: var(--s); color: var(--slide); border-color: var(--s); }
  .option.is-correct .option-mark { color: var(--s); }
  .option.is-wrong { border-color: var(--r); background: var(--r-bg); }
  .option.is-wrong .option-key { background: var(--r); color: var(--slide); border-color: var(--r); }
  .option.is-wrong .option-mark { color: var(--r); }

  .instructions { color: var(--muted); margin-top: 1rem; font-size: .95rem; }
  .match-key { list-style: none; padding: 0; margin: .75rem 0 0; display: grid; gap: .4rem; }
  .match-key li {
    display: grid; grid-template-columns: 1.6rem 1fr; gap: .5rem; align-items: start;
    background: var(--slide); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .55rem .75rem;
  }
  .match-letter { font-weight: 800; color: var(--violet); }
  .match-rows { display: grid; gap: .6rem; margin-top: 1rem; }
  .match-row {
    display: grid; gap: .4rem; background: var(--slide);
    border: 2px solid var(--line); border-radius: var(--radius-sm); padding: .7rem .8rem;
  }
  @media (min-width: 40rem) {
    .match-row { grid-template-columns: 12rem 1fr; align-items: center; }
    .match-result { grid-column: 2; }
  }
  .match-select { width: 100%; }
  .match-row.is-correct { border-color: var(--s); }
  .match-row.is-wrong { border-color: var(--r); }
  .match-result { font-weight: 650; font-size: .9rem; }
  .match-row.is-correct .match-result { color: var(--s); }
  .match-row.is-wrong .match-result { color: var(--r); }
  .match-note { color: var(--r); font-weight: 650; margin-top: .5rem; }
  .match-note:empty { display: none; }

  .order-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .5rem; }
  .order-row {
    display: grid; grid-template-columns: 2rem 1fr; gap: .4rem .6rem; align-items: center;
    background: var(--slide); border: 2px solid var(--line); border-radius: var(--radius-sm); padding: .6rem .75rem;
  }
  .order-pos { font-weight: 800; color: var(--violet); text-align: center; }
  .order-moves { grid-column: 2; display: flex; gap: .4rem; }
  .order-result { grid-column: 2; font-weight: 650; font-size: .9rem; }
  .order-result:empty { display: none; }
  .order-row.is-correct { border-color: var(--s); }
  .order-row.is-correct .order-result { color: var(--s); }
  .order-row.is-wrong { border-color: var(--r); }
  .order-row.is-wrong .order-result { color: var(--r); }

  .feedback {
    margin-top: 1.25rem; background: var(--slide); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 1rem 1.1rem; display: grid; gap: 1rem;
  }
  .verdict { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem .7rem; padding: .7rem .85rem; border-radius: var(--radius-sm); }
  .verdict-s { background: var(--s-bg); color: var(--s); }
  .verdict-i { background: var(--i-bg); color: var(--i); }
  .verdict-r { background: var(--r-bg); color: var(--r); }
  .verdict-icon { font-size: 1.45rem; font-weight: 800; line-height: 1; }
  .verdict-text { font-size: 1.2rem; font-weight: 800; }
  .verdict-points { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fb-block h4 { font-size: .95rem; margin-bottom: .3rem; }
  .fb-block p + p { margin-top: .35rem; }
  .why-not { list-style: none; padding: 0; margin: 0; display: grid; gap: .65rem; }
  .why-not li { padding-left: .8rem; border-left: 3px solid var(--line); }
  .why-not li.chosen { border-left-color: var(--r); }
  .why-not .choice { font-weight: 650; display: block; }
  .tag {
    display: inline-block; font-size: .75rem; font-weight: 750; padding: .05rem .5rem;
    border-radius: 999px; background: var(--r-bg); color: var(--r); margin-left: .35rem; vertical-align: 1px;
  }
  .pearl { background: var(--pink-soft); border-radius: var(--radius-sm); padding: .8rem .95rem; border-left: 4px solid var(--pink); }
  .pearl h4 { color: var(--pink); font-size: .95rem; margin-bottom: .25rem; }
  .pearl p { font-weight: 650; }
  .source { display: grid; gap: .35rem; }
  .badge {
    justify-self: start; font-size: .86rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: .3rem .6rem; background: var(--slide-2);
  }
  .badge strong { color: var(--ink); }
  details > summary { cursor: pointer; color: var(--violet); font-weight: 650; font-size: .9rem; }
  details.citation p { font-size: .88rem; margin-top: .3rem; }

  .actionbar {
    position: sticky; bottom: 0; z-index: 4; margin-top: 1.25rem;
    padding: .75rem 0 calc(.75rem + env(safe-area-inset-bottom));
    background: var(--bench); border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: .5rem;
  }
  .actionbar .btn.primary { flex: 1; }
  @media (min-width: 34rem) { .actionbar .btn.primary { flex: 0 0 auto; min-width: 12rem; } }

  /* Round intro */
  .round-intro { display: grid; gap: .6rem; padding-top: 1.5rem; }
  .round-intro h2 { font-size: clamp(1.8rem, 6vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; color: var(--violet); }
  .round-count { font-weight: 700; color: var(--pink); }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }

  /* Rapid Pearls */
  .deck-progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: .6rem; }
  .deck-progress span { display: block; height: 100%; background: var(--pink); }
  .card { margin-top: 1rem; perspective: 1400px; cursor: pointer; }
  .card-inner { display: grid; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--slide); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 1.25rem; display: flex; flex-direction: column; gap: .9rem; min-height: 17rem;
  }
  .face-front { border-top: 6px solid var(--violet); transform: rotateY(0deg); }
  .face-back { border-top: 6px solid var(--pink); transform: rotateY(180deg); }
  .card-stem { font-size: 1.08rem; line-height: 1.6; }
  .card-hint { margin-top: auto; color: var(--muted); font-size: .9rem; }
  .card-label { font-size: .95rem; font-weight: 750; color: var(--muted); }
  .card-answer { font-weight: 650; }
  ul.card-answer, ol.card-answer, .card-lefts { margin: 0; padding-left: 1.2rem; }
  .card-pearl { font-size: 1.25rem; font-weight: 750; line-height: 1.4; color: var(--ink); }
  .deck-controls { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; align-items: center; }
  .deck-controls .btn.primary { flex: 1 1 10rem; }
  @media (prefers-reduced-motion: reduce) {
    .card-inner, .timer-fill { transition: none; }
  }

  /* End screen */
  .end-hero { display: grid; gap: .4rem; padding: .5rem 0 1rem; }
  .end-hero h2 { font-size: clamp(2rem, 8vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: var(--violet); }
  .end-hero .end-stats { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .report {
    background: var(--slide); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 1rem 1.1rem; margin-top: .75rem; display: grid; gap: .5rem;
  }
  .report h3, .breakdowns h3, .missed h3 { font-size: 1.1rem; font-weight: 750; }
  .report-row { display: grid; gap: .4rem; padding: .6rem 0; border-top: 1px solid var(--line); }
  .report-row:first-of-type { border-top: 0; }
  @media (min-width: 40rem) { .report-row { grid-template-columns: 13rem 1fr; align-items: center; } }
  .report-domain { font-weight: 650; font-size: .92rem; }
  .report-cells { display: flex; flex-wrap: wrap; gap: 4px; }
  .rcell {
    font: inherit; display: grid; place-items: center; min-width: 3rem; padding: .25rem .35rem;
    border-radius: 6px; border: 1px solid var(--line); background: var(--slide-2); color: var(--muted);
  }
  button.rcell { cursor: pointer; }
  .rcell-id { font-size: .7rem; font-weight: 600; }
  .rcell-code { font-weight: 850; font-size: 1.05rem; line-height: 1.1; }
  .rcell-s { background: var(--s-bg); color: var(--s); border-color: var(--s); }
  .rcell-i { background: var(--i-bg); color: var(--i); border-color: var(--i); }
  .rcell-r { background: var(--r-bg); color: var(--r); border-color: var(--r); }
  .breakdowns { display: grid; gap: 1rem; margin-top: 1.25rem; }
  .table-wrap {
    overflow-x: auto; background: var(--slide); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: .75rem 1rem;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .95rem; }
  caption { text-align: left; font-weight: 750; font-size: 1.05rem; padding-bottom: .4rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  thead th { font-size: .85rem; color: var(--muted); font-weight: 650; }
  .num { text-align: right; white-space: nowrap; }
  tfoot th, tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--ink); }
  .bar { display: block; height: 4px; background: var(--line); border-radius: 2px; margin-top: .3rem; min-width: 3rem; }
  .bar span { display: block; height: 100%; background: var(--violet); border-radius: 2px; }
  .missed { margin-top: 1.5rem; display: grid; gap: .6rem; }
  .missed-item {
    background: var(--slide); border: 1px solid var(--line); border-left: 6px solid var(--r);
    border-radius: var(--radius-sm); padding: .7rem .9rem;
  }
  .missed-item.partial { border-left-color: var(--i); }
  .missed-item > summary { color: var(--ink); font-weight: 600; font-size: .97rem; }
  .missed-item[open] > summary { margin-bottom: .7rem; }
  .missed-item > :not(summary) + :not(summary) { margin-top: .55rem; }
  .missed-id { font-weight: 800; color: var(--violet); margin-right: .35rem; }
  .missed-item ul, .missed-item ol { margin: 0; padding-left: 1.2rem; }
  .field { display: grid; gap: .35rem; margin-top: 1.5rem; max-width: 24rem; }
  .end-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  .copy-status { margin-top: .6rem; font-weight: 650; }
  .copy-status:empty { display: none; }
  .copy-preview { margin-top: .75rem; }
  .copy-preview textarea { width: 100%; min-height: 14rem; margin-top: .5rem; font: .85rem/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .copy-scratch { position: fixed; top: -1000px; left: -1000px; opacity: 0; }
</style>
</head>
<body>
<noscript><p style="padding:1rem">This game needs JavaScript. Turn it on in your browser settings and reload.</p></noscript>
<div class="shell">
  <div id="runtime-error" class="alert" role="alert" hidden></div>

<script>
"use strict";

/* ---------------------------------------------------------------------
   CONFIGURATION
   --------------------------------------------------------------------- */
const CONFIG = {
  POINTS_CORRECT: 100,        // fully correct answer
  STREAK_BONUS_STEP: 10,      // +10 for each consecutive correct answer before this one
  STREAK_BONUS_CAP: 50,       // streak bonus never exceeds +50 on one question
  PARTIAL_CREDIT: 0.5,        // match/order only: partly correct earns 100 x fraction correct x 0.5, no streak bonus
  TIMER_CHOICES: [0, 30, 60, 90], // seconds per question; 0 = off (default)
  TIMER_WARNING_SECONDS: 10
};
const TYPES = ["mcq", "case_mcq", "match", "order"];
const DOMAINS = ["Empiric therapy", "Definitive therapy", "Dosing & PK/PD", "Resistance & susceptibility", "Monitoring & ADEs", "Stewardship", "Diagnostics"];
/* Order of rounds in Rounds mode: mechanisms and lab interpretation first, then treatment decisions, then monitoring. */
const ROUND_ORDER = ["Resistance & susceptibility", "Diagnostics", "Empiric therapy", "Definitive therapy", "Dosing & PK/PD", "Stewardship", "Monitoring & ADEs"];
const BLOOMS = ["recall", "apply", "analyze"];
const SOURCE_TYPES = ["handout", "pearl_cited", "pearl_uncited"];
const STATUSES = ["ready", "hold"];
const TYPE_LABEL = { mcq: "Question", case_mcq: "Case", match: "Match", order: "Order" };
const MODE_LABEL = { rounds: "Rounds", cases: "Case Rounds", pearls: "Rapid Pearls", retry: "Retry Missed" };

/* ---------------------------------------------------------------------
   VALIDATION
   --------------------------------------------------------------------- */
function isText(v) { return typeof v === "string" && v.trim().length > 0; }
function isMultipleChoice(item) { return item.type === "mcq" || item.type === "case_mcq"; }

/* Returns a list of problems for one item (empty list = valid). */
function validateItem(item, seenIds) {
  const errors = [];
  if (!item || typeof item !== "object" || Array.isArray(item)) return ["entry is not an item object"];
  if (!isText(item.id)) errors.push("missing id");
  else if (seenIds.has(item.id)) errors.push("duplicate id");
  if (!TYPES.includes(item.type)) errors.push("type must be mcq, case_mcq, match, or order");
  if (!DOMAINS.includes(item.domain)) errors.push("domain is not one of the listed domains");
  if (!BLOOMS.includes(item.bloom)) errors.push("bloom must be recall, apply, or analyze");
  if (!Number.isInteger(item.difficulty) || item.difficulty < 1 || item.difficulty > 3) errors.push("difficulty must be 1, 2, or 3");
  if (!isText(item.stem)) errors.push("missing stem");
  if (!isText(item.pearl)) errors.push("missing pearl");
  if (!STATUSES.includes(item.status)) errors.push("status must be ready or hold");

  const rat = item.rationale;
  const hasDistractorList = rat && Array.isArray(rat.distractors) && rat.distractors.every(isText);
  if (!rat || typeof rat !== "object") errors.push("missing rationale");
  else {
    if (!isText(rat.correct)) errors.push("missing rationale.correct");
    if (!hasDistractorList) errors.push("rationale.distractors must be a list of explanations");
  }

  const src = item.source;
  if (!src || typeof src !== "object") errors.push("missing source");
  else {
    if (!SOURCE_TYPES.includes(src.type)) errors.push("source.type must be handout, pearl_cited, or pearl_uncited");
    if (!isText(src.locator)) errors.push("missing source.locator");
    if (src.type === "pearl_cited" && !isText(src.citation)) errors.push("pearl_cited items need source.citation");
  }

  if (isMultipleChoice(item)) {
    const opts = item.options;
    if (!Array.isArray(opts) || opts.length !== 4 || !opts.every(isText)) errors.push("options must be 4 non-empty choices");
    else if (new Set(opts.map(o => o.trim())).size !== 4) errors.push("options must all be different");
    if (!Number.isInteger(item.answer_index) || item.answer_index < 0 || item.answer_index > 3) errors.push("answer_index must be 0, 1, 2, or 3");
    if (hasDistractorList && rat.distractors.length !== 3) errors.push("rationale.distractors needs 3 entries (one per wrong option)");
  }
  if (item.type === "match") {
    const pairs = item.pairs;
    const wellFormed = Array.isArray(pairs) && pairs.length >= 2 && pairs.length <= 8 &&
      pairs.every(p => Array.isArray(p) && p.length === 2 && p.every(isText));
    if (!wellFormed) errors.push("pairs must be 2-8 [left, right] text pairs");
    else {
      if (new Set(pairs.map(p => p[0].trim())).size !== pairs.length) errors.push("left sides of pairs must all be different");
      if (new Set(pairs.map(p => p[1].trim())).size !== pairs.length) errors.push("right sides of pairs must all be different");
    }
  }
  if (item.type === "order") {
    const seq = item.sequence;
    if (!Array.isArray(seq) || seq.length < 2 || seq.length > 10 || !seq.every(isText)) errors.push("sequence must be 2-10 steps");
    else if (new Set(seq.map(s => s.trim())).size !== seq.length) errors.push("sequence steps must all be different");
  }
  return errors;
}

/* Splits the bank into ready / hold / invalid. Invalid items never load. */
function validateBank(bank) {
  const report = { meta: {}, ready: [], hold: [], invalid: [], fatal: null };
  if (!bank || typeof bank !== "object" || !Array.isArray(bank.items)) {
    report.fatal = "The BANK block is missing or has no items list, so no questions could load.";
    return report;
  }
  report.meta = bank.meta && typeof bank.meta === "object" ? bank.meta : {};
  const seen = new Set();
  bank.items.forEach((item, n) => {
    const errors = validateItem(item, seen);
    const hasId = item && isText(item.id);
    const label = hasId ? item.id : `Item ${n + 1} (no id)`;
    if (hasId) seen.add(item.id);
    if (errors.length) report.invalid.push({ id: label, status: item && item.status, errors });
    else if (item.status === "ready") report.ready.push(item);
    else report.hold.push(item);
  });
  return report;
}

/* ---------------------------------------------------------------------
   UTILITIES
   --------------------------------------------------------------------- */
function range(n) { return Array.from({ length: n }, (_, i) => i); }

/* Fisher-Yates shuffle; returns a new array. */
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Option shuffling never edits item.options. It builds `order`, where
   order[displayPosition] = original option index. Scoring maps the chosen
   display position back through `order` and compares it to answer_index,
   so shuffling cannot change which option is correct. */
function shuffleOptions(item) {
  const order = shuffle(range(item.options.length));
  return { order, correctPos: order.indexOf(item.answer_index) };
}

/* rationale.distractors explains the wrong options in original order,
   skipping the correct option, so indexes after the answer shift down by one. */
function distractorRationale(item, originalIndex) {
  if (originalIndex === item.answer_index) return "";
  const k = originalIndex < item.answer_index ? originalIndex : originalIndex - 1;
  return item.rationale.distractors[k] || "";
}

/* Order items start scrambled; this avoids showing them already solved. */
function scrambledOrder(n) {
  if (n < 2) return range(n);
  let a = shuffle(range(n));
  for (let tries = 0; tries < 20 && a.every((v, i) => v === i); tries++) a = shuffle(range(n));
  if (a.every((v, i) => v === i)) [a[0], a[1]] = [a[1], a[0]];
  return a;
}

function letter(i) { return String.fromCharCode(65 + i); }
function fmt(n) { return Number(n).toLocaleString("en-US"); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
function pctOf(b) { return b.attempted ? Math.round((100 * b.correct) / b.attempted) : 0; }
function truncate(s, max) { return s.length > max ? s.slice(0, max - 1).trimEnd() + "…" : s; }

/* Splits "Main topic: detail" into a headline and subtitle. */
function splitTopic(topic) {
  const t = isText(topic) ? topic : "ID topic discussion";
  const at = t.indexOf(": ");
  return at > 0 ? { main: t.slice(0, at), sub: t.slice(at + 2) } : { main: t, sub: "" };
}

/* Shortens a citation string to first-author surname + year for the badge,
   using only what is in the citation (no years are added). Segments without
   an author (e.g. "73(11):e3842") are skipped. The full citation stays available. */
function shortCitation(citation) {
  if (!isText(citation)) return "";
  const out = [];
  for (const part of citation.split(";").map(s => s.trim()).filter(Boolean)) {
    const author = part.match(/^([A-Z][A-Za-z'\u2019-]+)\s+[A-Z]{1,3}\b/);
    if (!author) continue;
    const year = part.match(/\b(19|20)\d{2}\b/);
    out.push(`${author[1]}${/et al/i.test(part) ? " et al." : ""}${year ? " " + year[0] : ""}`);
  }
  return out.length ? out.join("; ") : citation;
}

function sourceText(item) {
  const s = item.source;
  if (s.type === "handout") return `Handout: ${s.locator}`;
  if (s.type === "pearl_cited") return `Cited: ${s.citation}`;
  return `Uncited pearl: ${s.locator}`;
}

/* Small DOM builder. Text is always set with textContent, never innerHTML. */
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2).toLowerCase(), value);
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

}

/* Global keyboard routing: typing in form fields is never intercepted. */
document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (keyHandler) keyHandler(e);
});

/* ---------------------------------------------------------------------
   SCORING (pure functions)
   --------------------------------------------------------------------- */
function scoreMcq(item, order, selectedPos) {
  const chosenIndex = selectedPos === null ? null : order[selectedPos];
  const correct = chosenIndex === item.answer_index;
  return {
    correct, fraction: correct ? 1 : 0, chosenIndex,
    response: chosenIndex === null ? "No answer" : item.options[chosenIndex],
    correctAnswer: item.options[item.answer_index]
  };
}

/* selections[leftIndex] = chosen right-side index (original pair indexes). A row is correct when they match. */
function scoreMatch(item, selections) {
  const n = item.pairs.length;
  const rowCorrect = range(n).map(i => selections !== null && selections[i] === i);
  const k = rowCorrect.filter(Boolean).length;
  return {
    correct: k === n, fraction: k / n, rowCorrect,
    response: selections === null ? "No answer" : `${k} of ${n} pairs correct`,
    correctAnswer: item.pairs.map(p => `${p[0]}: ${p[1]}`).join("; ")
  };
}

/* arrangement[position] = original sequence index. A position is correct when they match. */
function scoreOrder(item, arrangement) {
  const n = item.sequence.length;
  const posCorrect = range(n).map(i => arrangement !== null && arrangement[i] === i);
  const k = posCorrect.filter(Boolean).length;
  return {
    correct: k === n, fraction: k / n, posCorrect,
    response: arrangement === null ? "No answer" : `${k} of ${n} steps in the right place`,
    correctAnswer: item.sequence.map((s, i) => `${i + 1}. ${s}`).join(" ")
  };
}

function pointsFor(outcome, streakBefore) {
  if (outcome.correct) {
    return CONFIG.POINTS_CORRECT + Math.min(CONFIG.STREAK_BONUS_STEP * streakBefore, CONFIG.STREAK_BONUS_CAP);
  }
  return Math.round(CONFIG.POINTS_CORRECT * outcome.fraction * CONFIG.PARTIAL_CREDIT);
}

/* S = fully correct, I = partly correct (match/order), R = missed. */
function resultCode(res) { return res.correct ? "S" : res.fraction > 0 ? "I" : "R"; }
function statusWord(res) {
  if (res.correct) return "correct";
  if (res.timedOut) return "missed, time ran out";
  return res.fraction > 0 ? "partly correct" : "missed";
}

/* Each result is counted exactly once in the total, once in its domain, and
   once in its Bloom level, so both breakdowns always sum to the total. */
function tally(results) {
  const blank = () => ({ attempted: 0, correct: 0, points: 0 });
  const total = blank(), byDomain = {}, byBloom = {};
  for (const r of results) {
    if (!byDomain[r.domain]) byDomain[r.domain] = blank();
    if (!byBloom[r.bloom]) byBloom[r.bloom] = blank();
    for (const bucket of [total, byDomain[r.domain], byBloom[r.bloom]]) {
      bucket.attempted += 1;
      if (r.correct) bucket.correct += 1;
      bucket.points += r.points;
    }
  }
  return { total, byDomain, byBloom };
}

function talliesConsistent(t) {
  const sum = (group, key) => Object.values(group).reduce((s, b) => s + b[key], 0);
  return ["attempted", "correct", "points"].every(k => sum(t.byDomain, k) === t.total[k] && sum(t.byBloom, k) === t.total[k]);
}

/* ---------------------------------------------------------------------
   START SCREEN
   --------------------------------------------------------------------- */
function currentMissedIds() {
  return session.report.ready.filter(i => session.missed.has(i.id)).map(i => i.id);
}

function statusCell(code) {
  return el("span", { class: `cell cell-${code.toLowerCase()}`, "aria-hidden": "true", text: code });
}

function legend() {
  return el("ul", { class: "legend", "aria-label": "Report key" },
    el("li", {}, statusCell("S"), "Correct"),
    el("li", {}, statusCell("I"), "Partly correct (match and order)"),
    el("li", {}, statusCell("R"), "Missed"));
}

function renderStart() {
  run = null;
  deck = null;
  const rep = session.report;
  const meta = rep.meta;
  const topic = splitTopic(meta.topic);

  if (rep.fatal) {
    setScreen(el("section", { class: "alert", role: "alert" }, el("h2", { text: "No questions loaded" }), el("p", { text: rep.fatal })));
    return;
  }

  const ready = rep.ready;
  const caseCount = ready.filter(i => i.type === "case_mcq").length;
  const roundCount = ROUND_ORDER.filter(d => ready.some(i => i.domain === d)).length;
  const missedCount = currentMissedIds().length;

  const hero = el("header", { class: "hero" },
    el("h1", { text: topic.main }),
    topic.sub ? el("p", { class: "sub", text: topic.sub }) : null,
    el("p", { class: "source-line" },
      `Built from the handout “${meta.handout_title || "topic discussion"}” for ${meta.learner_level || "resident"} learners. `,
      `${plural(ready.length, "question")} ready, ${rep.hold.length} held for preceptor review (bank version ${meta.version ?? "not set"}).`));

  const errors = rep.invalid.length ? el("section", { class: "alert", role: "alert", "aria-labelledby": "invalid-h" },
    el("h2", { id: "invalid-h", text: `${plural(rep.invalid.length, "item")} failed validation and ${rep.invalid.length === 1 ? "was" : "were"} not loaded` }),
    el("ul", {}, rep.invalid.map(x => el("li", {}, el("strong", { text: x.id }), ` (status: ${x.status || "none"}): ${x.errors.join("; ")}.`))),
    el("p", { text: "Fix these in the BANK block at the top of the file, save, and reload." })) : null;

  const modeDefs = [
    { mode: "rounds", name: "Rounds", count: plural(roundCount, "round"), desc: `All ${ready.length} questions, grouped by domain.`, off: ready.length === 0 },
    { mode: "cases", name: "Case Rounds", count: plural(caseCount, "case"), desc: "Patient cases only.", off: caseCount === 0 },
    { mode: "pearls", name: "Rapid Pearls", count: plural(ready.length, "card"), desc: "Flip cards with the answer and pearl on the back. Not scored.", off: ready.length === 0 },
    { mode: "retry", name: "Retry Missed", count: `${missedCount} missed`, desc: missedCount ? "Replay the questions you missed this session." : "Unlocks after you miss a question in any mode.", off: missedCount === 0 }
  ];
  const modes = el("div", { class: "modes" }, modeDefs.map(m =>
    el("button", { type: "button", class: "mode", "data-mode": m.mode, disabled: m.off, onclick: () => chooseMode(m.mode) },
      el("span", { class: "mode-name", text: m.name }),
      el("span", { class: "mode-count", text: m.count }),
      el("span", { class: "mode-desc", text: m.desc }))));

  const timerSelect = el("select", { id: "timer-select", onchange: (e) => { session.timerSeconds = Number(e.target.value); } },
    CONFIG.TIMER_CHOICES.map(s => el("option", { value: String(s), selected: s === session.timerSeconds, text: s ? `${s} seconds per question` : "Off" })));

  const node = el("div", { class: "screen start" },
    hero,
    errors,
    ready.length === 0 ? el("p", { class: "alert", text: "No items are marked ready. Change an item's status to \"ready\" in the BANK block to play." }) : null,
    el("section", { "aria-labelledby": "modes-h" },
      el("h2", { id: "modes-h", class: "section-h", text: "Choose a mode" }),
      modes),
    el("div", { class: "settings" },
      el("label", { for: "timer-select", text: "Question timer" }),
      timerSelect,
      el("p", { class: "hint", text: "When time runs out, the question counts as missed and the explanation appears." })),
    el("section", { class: "how", "aria-labelledby": "how-h" },
      el("h2", { id: "how-h", class: "section-h", text: "How scoring works" }),
      el("p", { text: `A correct answer earns ${CONFIG.POINTS_CORRECT} points, plus ${CONFIG.STREAK_BONUS_STEP} for each correct answer already in your streak (up to +${CONFIG.STREAK_BONUS_CAP}). Partly correct match and order questions earn partial points. Your answers build a report that reads like a susceptibility panel.` }),
      legend(),
      el("p", { class: "muted" }, "Keyboard: ", el("kbd", { text: "1" }), "–", el("kbd", { text: "4" }), " picks a choice, ", el("kbd", { text: "Enter" }), " checks your answer and moves on.")));

  setScreen(node, null, node.querySelector("h1"));
}

function chooseMode(mode) {
  if (mode === "pearls") startPearls();
  else if (mode === "retry") startRun("retry", currentMissedIds());
  else startRun(mode);
}

/* ---------------------------------------------------------------------
   SCORED SESSIONS
   --------------------------------------------------------------------- */
function startRun(mode, ids) {
  const pool = session.report.ready;
  let items;
  if (mode === "cases") items = pool.filter(i => i.type === "case_mcq");
  else if (mode === "retry") items = pool.filter(i => (ids || []).includes(i.id));
  else items = pool.slice();
  if (!items.length) { renderStart(); return; }
  run = {
    mode, retryIds: mode === "retry" ? items.map(i => i.id) : null,
    queue: buildQueue(mode, items), index: 0, results: [],
    points: 0, streak: 0, bestStreak: 0,
    timerSeconds: session.timerSeconds, startedAt: new Date(), endedEarly: false, current: null
  };
  showStep();
}

/* Rounds mode groups items by domain (ROUND_ORDER) and shuffles within each
   round. Case Rounds and Retry Missed play as one shuffled round. */
function buildQueue(mode, items) {
  const groups = mode === "rounds"
    ? ROUND_ORDER.map(d => ({ label: d, items: shuffle(items.filter(i => i.domain === d)) })).filter(g => g.items.length)
    : [{ label: MODE_LABEL[mode], items: shuffle(items) }];
  const queue = [];
  groups.forEach((g, gi) => g.items.forEach((item, pos) => queue.push({
    item, round: gi, roundCount: groups.length, roundLabel: g.label, roundSize: g.items.length,
    introShown: mode !== "rounds" || pos > 0
  })));
  return queue;
}

function showStep() {
  if (run.index >= run.queue.length) { finishRun(false); return; }
  const entry = run.queue[run.index];
  if (entry.introShown) renderItem(entry);
  else renderRoundIntro(entry);
}

function advance() {
  if (!run || !run.current || !run.current.answered) return;
  run.index += 1;
  showStep();
}

function finishRun(endedEarly) {
  clearTimer();
  const finished = run;
  finished.endedEarly = endedEarly;
  finished.current = null;
  renderEnd(finished);
}

function progressStrip(r) {
  const byIndex = new Map(r.results.map(x => [x.queueIndex, x]));
  return el("div", { class: "strip", "aria-hidden": "true" }, r.queue.map((entry, i) => {
    const res = byIndex.get(i);
    let cls = "cell";
    if (res) cls += ` cell-${resultCode(res).toLowerCase()}`;
    else if (i === r.index) cls += " cell-current";
    if (i > 0 && entry.round !== r.queue[i - 1].round) cls += " cell-newround";
    return el("span", { class: cls, title: `${entry.item.id}${res ? ": " + statusWord(res) : ""}`, text: res ? resultCode(res) : String(i + 1) });
  }));
}

function quizTopBar() {
  const endBtn = el("button", { type: "button", class: "btn quiet small" }, "End session");
  let armed = false, resetTimer = null;
  /* Two-step confirm so a stray tap doesn't end the session. */
  endBtn.addEventListener("click", () => {
    if (!run.results.length) { renderStart(); return; }
    if (!armed) {
      armed = true;
      endBtn.textContent = "Tap again to end";
      resetTimer = setTimeout(() => { armed = false; endBtn.textContent = "End session"; }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    finishRun(true);
  });
  const answered = run.results.length;
  const correct = run.results.filter(x => x.correct).length;
  return el("header", { class: "topbar", id: "topbar" },
    el("div", { class: "topbar-row" },
      el("p", { class: "mode-label", text: MODE_LABEL[run.mode] }),
      endBtn),
    el("p", { class: "score", "aria-hidden": "true" },
      el("span", {}, el("span", { class: "pts", text: fmt(run.points) }), " pts"),
      el("span", { class: "streak", text: `Streak ${run.streak}` })),
    progressStrip(run),
    el("p", { class: "sr-only", text: `${answered} of ${run.queue.length} answered, ${correct} correct, ${fmt(run.points)} points, streak ${run.streak}.` }));
}

function renderRoundIntro(entry) {
  const begin = () => { entry.introShown = true; renderItem(entry); };
  const node = el("section", { class: "screen" },
    quizTopBar(),
    el("div", { class: "round-intro" },
      el("p", { class: "round-count", text: `Round ${entry.round + 1} of ${entry.roundCount}` }),
      el("h2", { id: "round-h", tabindex: "-1", text: entry.roundLabel }),
      el("p", { text: `${plural(entry.roundSize, "question")} in this round.` }),
      el("div", { class: "actions" }, el("button", { type: "button", class: "btn primary", onclick: begin }, `Start round ${entry.round + 1}`))));
  setScreen(node, (e) => {
    if (e.key === "Enter" && !e.target.closest("button, a, summary")) { e.preventDefault(); begin(); }
  }, node.querySelector("#round-h"));
}

/* ---------------------------------------------------------------------
   ITEM RENDERING
   --------------------------------------------------------------------- */
function renderItem(entry) {
  const item = entry.item;
  const c = run.current = { entry, item, answered: false, selection: null, result: null };
  if (isMultipleChoice(item)) Object.assign(c, shuffleOptions(item));
  if (item.type === "match") {
    c.leftOrder = shuffle(range(item.pairs.length));
    c.rightOrder = shuffle(range(item.pairs.length));
    c.matchSelections = item.pairs.map(() => null);
  }
  if (item.type === "order") c.arrangement = scrambledOrder(item.sequence.length);

  const body = isMultipleChoice(item) ? renderMcqBody(c) : item.type === "match" ? renderMatchBody(c) : renderOrderBody(c);
  const primary = el("button", { type: "button", class: "btn primary", id: "primary", onclick: primaryAction }, "Check answer");

  const node = el("section", { class: "screen quiz" },
    quizTopBar(),
    el("div", { class: "item-head" },
      el("h2", { class: "qcount", text: `Question ${run.index + 1} of ${run.queue.length}` }),
      el("ul", { class: "chips" },
        el("li", { class: "chip", text: item.domain }),
        el("li", { class: "chip", text: TYPE_LABEL[item.type] }),
        el("li", { class: "chip", text: cap(item.bloom) }),
        el("li", { class: "chip" },
          el("span", { "aria-hidden": "true", text: "●".repeat(item.difficulty) + "○".repeat(3 - item.difficulty) }),
          el("span", { class: "sr-only", text: `Difficulty ${item.difficulty} of 3` })))),
    run.timerSeconds ? el("div", { class: "timer", id: "timer" },
      el("div", { class: "timer-track", "aria-hidden": "true" }, el("div", { class: "timer-fill" })),
      el("span", { class: "timer-text" })) : null,
    el("p", { class: `stem${item.type === "case_mcq" ? " stem-case" : ""}`, id: "stem", tabindex: "-1", text: item.stem }),
    body,
    el("section", { class: "feedback", id: "feedback", hidden: true, "aria-label": "Answer feedback" }),
    el("div", { class: "actionbar" }, primary));

  setScreen(node, itemKeyHandler, node.querySelector("#stem"));
  updatePrimary();
  startTimer();
}

function renderMcqBody(c) {
  c.optionButtons = c.order.map((orig, pos) => el("button", {
    type: "button", class: "option", "aria-pressed": "false", "data-option-pos": String(pos),
    onclick: () => selectOption(pos, false)
  },
    el("span", { class: "option-key", "aria-hidden": "true", text: String(pos + 1) }),
    el("span", { class: "option-text" }, el("span", { class: "sr-only", text: `Choice ${pos + 1}: ` }), c.item.options[orig]),
    el("span", { class: "option-mark" })));
  return el("div", { class: "options", role: "group", "aria-label": "Answer choices" }, c.optionButtons);
}

function selectOption(pos, moveFocus) {
  const c = run && run.current;
  if (!c || c.answered) return;
  c.selection = pos;
  c.optionButtons.forEach((b, i) => {
    b.setAttribute("aria-pressed", String(i === pos));
    b.classList.toggle("selected", i === pos);
  });
  if (moveFocus) c.optionButtons[pos].focus();
  updatePrimary();
}

function renderMatchBody(c) {
  const item = c.item;
  c.matchRows = [];
  c.matchSelects = [];
  const key = el("ol", { class: "match-key", "aria-label": "Descriptions" }, c.rightOrder.map((orig, pos) =>
    el("li", {}, el("span", { class: "match-letter", text: letter(pos) }), el("span", { text: item.pairs[orig][1] }))));
  const rows = el("div", { class: "match-rows" }, c.leftOrder.map((li) => {
    const id = `match-${li}`;
    const select = el("select", {
      id, class: "match-select",
      onchange: (e) => { c.matchSelections[li] = e.target.value === "" ? null : Number(e.target.value); onMatchChange(); }
    },
      el("option", { value: "", text: "Choose a description" }),
      c.rightOrder.map((orig, pos) => el("option", { value: String(orig), text: `${letter(pos)}. ${item.pairs[orig][1]}` })));
    const row = el("div", { class: "match-row", "data-left": String(li) },
      el("label", { for: id, text: item.pairs[li][0] }), select, el("p", { class: "match-result", hidden: true }));
    c.matchSelects[li] = select;
    c.matchRows[li] = row;
    return row;
  }));
  c.matchNote = el("p", { class: "match-note", "aria-live": "polite" });
  return el("div", { class: "match" },
    el("p", { class: "instructions", text: "Choose the description that matches each item. Each description is used once." }),
    key, rows, c.matchNote);
}

function matchHasDuplicates(c) {
  const chosen = c.matchSelections.filter(v => v !== null);
  return new Set(chosen).size !== chosen.length;
}

function onMatchChange() {
  const c = run.current;
  c.matchNote.textContent = matchHasDuplicates(c) ? "Each description can only be used once. Change the duplicate before checking." : "";
  updatePrimary();
}

function renderOrderBody(c) {
  c.orderList = el("ol", { class: "order-list", "aria-label": "Steps in your order" });
  drawOrderList(c, null);
  return el("div", { class: "order" },
    el("p", { class: "instructions", text: "Put the steps in order with the Up and Down buttons." }),
    c.orderList);
}

function drawOrderList(c, focusKey) {
  const item = c.item;
  const n = c.arrangement.length;
  const result = c.result;
  c.orderList.replaceChildren(...c.arrangement.map((orig, pos) => {
    const text = item.sequence[orig];
    let cls = "order-row", resultText = "";
    if (result) {
      const ok = result.outcome.posCorrect[pos];
      cls += ok ? " is-correct" : " is-wrong";
      resultText = ok ? "✓ Right place" : `✗ Belongs at step ${orig + 1}`;
    }
    return el("li", { class: cls },
      el("span", { class: "order-pos", text: String(pos + 1) }),
      el("span", { class: "order-text", text }),
      el("span", { class: "order-result", text: resultText }),
      result ? null : el("span", { class: "order-moves" },
        el("button", { type: "button", class: "btn quiet small", "data-move": `${orig}:up`, "aria-label": `Move “${text}” up`, disabled: pos === 0, onclick: () => moveStep(pos, -1, `${orig}:up`) }, "Up"),
        el("button", { type: "button", class: "btn quiet small", "data-move": `${orig}:down`, "aria-label": `Move “${text}” down`, disabled: pos === n - 1, onclick: () => moveStep(pos, 1, `${orig}:down`) }, "Down")));
  }));
  if (focusKey) {
    /* Keep focus on the moved step; if its button is now disabled (top/bottom), use the other direction. */
    let btn = c.orderList.querySelector(`[data-move="${focusKey}"]`);
    if (!btn || btn.disabled) {
      const [orig, dir] = focusKey.split(":");
      btn = c.orderList.querySelector(`[data-move="${orig}:${dir === "up" ? "down" : "up"}"]`);
    }
    if (btn) btn.focus();
  }
}

function moveStep(pos, delta, focusKey) {
  const c = run.current;
  if (!c || c.answered) return;
  const target = pos + delta;
  if (target < 0 || target >= c.arrangement.length) return;
  [c.arrangement[pos], c.arrangement[target]] = [c.arrangement[target], c.arrangement[pos]];
  drawOrderList(c, focusKey);
  announce(`Moved to step ${target + 1}.`);
}

function canSubmit(c) {
  if (isMultipleChoice(c.item)) return c.selection !== null;
  if (c.item.type === "match") return c.matchSelections.every(v => v !== null) && !matchHasDuplicates(c);
  return true;
}

function updatePrimary() {
  const c = run && run.current;
  const btn = document.getElementById("primary");
  if (!c || !btn) return;
  if (c.answered) {
    btn.disabled = false;
    btn.textContent = run.index + 1 >= run.queue.length ? "See results" : "Next question";
  } else {
    btn.disabled = !canSubmit(c);
    btn.textContent = "Check answer";
  }
}

function primaryAction() {
  const c = run && run.current;
  if (!c) return;
  if (c.answered) advance();
  else if (canSubmit(c)) submitAnswer(false);
}

function itemKeyHandler(e) {
  const c = run && run.current;
  if (!c) return;
  if (/^[1-9]$/.test(e.key)) {
    if (isMultipleChoice(c.item) && !c.answered) {
      const pos = Number(e.key) - 1;
      if (pos < c.order.length) { e.preventDefault(); selectOption(pos, true); }
    }
    return;
  }
  if (e.key !== "Enter") return;
  const option = e.target.closest("[data-option-pos]");
  if (option) {
    /* Enter on a choice selects it; Enter on the already-selected choice checks the answer. */
    e.preventDefault();
    const pos = Number(option.dataset.optionPos);
    if (c.answered || c.selection === pos) primaryAction();
    else selectOption(pos, false);
    return;
  }
  if (e.target.closest("button, a, summary")) return; // let buttons and links activate normally
  e.preventDefault();
  primaryAction();
}

/* ---------------------------------------------------------------------
   ANSWERING AND FEEDBACK
   --------------------------------------------------------------------- */
function submitAnswer(timedOut) {
  const c = run && run.current;
  if (!c || c.answered) return;
  if (!timedOut && !canSubmit(c)) return;
  clearTimer();
  const item = c.item;
  /* A timeout scores as "no answer", even if a choice was highlighted but not checked. */
  const outcome = isMultipleChoice(item) ? scoreMcq(item, c.order, timedOut ? null : c.selection)
    : item.type === "match" ? scoreMatch(item, timedOut ? null : c.matchSelections)
    : scoreOrder(item, timedOut ? null : c.arrangement);

  const streakBefore = run.streak;
  const points = pointsFor(outcome, streakBefore);
  run.streak = outcome.correct ? streakBefore + 1 : 0;
  run.bestStreak = Math.max(run.bestStreak, run.streak);
  run.points += points;

  const result = {
    queueIndex: run.index, item, id: item.id, domain: item.domain, bloom: item.bloom, type: item.type,
    correct: outcome.correct, fraction: outcome.fraction, points,
    bonus: outcome.correct ? points - CONFIG.POINTS_CORRECT : 0, timedOut: !!timedOut, outcome
  };
  run.results.push(result);
  if (outcome.correct) session.missed.delete(item.id);
  else session.missed.add(item.id);

  c.answered = true;
  c.result = result;
  showFeedback(c);
}

function showFeedback(c) {
  const item = c.item;
  const res = c.result;
  const out = res.outcome;

  if (isMultipleChoice(item)) {
    c.optionButtons.forEach((b, pos) => {
      b.classList.add("locked");
      b.setAttribute("aria-disabled", "true");
      const mark = b.querySelector(".option-mark");
      if (pos === c.correctPos) { b.classList.add("is-correct"); mark.textContent = "✓ Correct answer"; }
      else if (pos === c.selection && !res.timedOut) { b.classList.add("is-wrong"); mark.textContent = "✗ Your answer"; }
    });
  } else if (item.type === "match") {
    item.pairs.forEach((pair, li) => {
      const row = c.matchRows[li];
      const ok = out.rowCorrect[li];
      c.matchSelects[li].disabled = true;
      row.classList.add(ok ? "is-correct" : "is-wrong");
      const note = row.querySelector(".match-result");
      note.hidden = false;
      note.textContent = ok ? "✓ Correct" : `✗ Correct match: ${pair[1]}`;
    });
    c.matchNote.textContent = "";
  } else {
    drawOrderList(c, null);
  }

  const code = resultCode(res);
  const verdictText = res.timedOut ? "Time's up" : res.correct ? "Correct" : res.fraction > 0 ? "Partly correct" : "Incorrect";
  const icon = res.correct ? "✓" : res.fraction > 0 ? "◐" : "✗";
  const pointsText = res.bonus ? `+${res.points} pts (includes +${res.bonus} streak bonus)` : `+${res.points} pts`;
  const verdict = el("div", { class: `verdict verdict-${code.toLowerCase()}`, id: "verdict", tabindex: "-1" },
    el("span", { class: "verdict-icon", "aria-hidden": "true", text: icon }),
    el("h3", { class: "verdict-text", text: verdictText }),
    el("span", { class: "verdict-points", text: pointsText }));

  const blocks = [verdict];
  if (isMultipleChoice(item)) {
    if (!res.correct) {
      blocks.push(el("div", { class: "fb-block" }, el("h4", { text: "Correct answer" }), el("p", { text: `Choice ${c.correctPos + 1}: ${out.correctAnswer}` })));
    }
    blocks.push(el("div", { class: "fb-block" }, el("h4", { text: "Why it's right" }), el("p", { text: item.rationale.correct })));
    const others = c.order.map((orig, pos) => ({ orig, pos })).filter(o => o.pos !== c.correctPos);
    blocks.push(el("div", { class: "fb-block" },
      el("h4", { text: "Why the other choices are wrong" }),
      el("ul", { class: "why-not" }, others.map(o => {
        const chosen = o.pos === c.selection && !res.timedOut;
        return el("li", { class: chosen ? "chosen" : "" },
          el("span", { class: "choice" }, `Choice ${o.pos + 1}: ${item.options[o.orig]}`, chosen ? el("span", { class: "tag", text: "Your answer" }) : null),
          distractorRationale(item, o.orig));
      }))));
  } else {
    blocks.push(el("div", { class: "fb-block" }, el("h4", { text: "Why it's right" }), el("p", { text: item.rationale.correct })));
    if (item.rationale.distractors.length) {
      blocks.push(el("div", { class: "fb-block" },
        el("h4", { text: "Common mix-ups" }),
        el("ul", { class: "why-not" }, item.rationale.distractors.map(d => el("li", { text: d })))));
    }
  }
  blocks.push(el("aside", { class: "pearl", "aria-label": "Pearl" }, el("h4", { text: "Pearl" }), el("p", { text: item.pearl })));
  blocks.push(sourceBadge(item));

  const fb = document.getElementById("feedback");
  fb.replaceChildren(...blocks);
  fb.hidden = false;
  document.getElementById("topbar").replaceWith(quizTopBar());
  updatePrimary();
  verdict.focus();
  announce(`${verdictText}. ${pointsText}.`);
}

function sourceBadge(item) {
  const s = item.source;
  if (s.type === "handout") {
    return el("div", { class: "source" }, el("p", { class: "badge" }, el("strong", { text: "Handout: " }), s.locator));
  }
  if (s.type === "pearl_cited") {
    return el("div", { class: "source" },
      el("p", { class: "badge" }, el("strong", { text: "Cited: " }), shortCitation(s.citation)),
      el("details", { class: "citation" }, el("summary", { text: "Full citation" }), el("p", { text: s.citation }), el("p", { class: "muted", text: s.locator })));
  }
  return el("div", { class: "source" }, el("p", { class: "badge" }, el("strong", { text: "Uncited pearl: " }), s.locator));
}

/* ---------------------------------------------------------------------
   TIMER (optional, off by default)
   --------------------------------------------------------------------- */
function startTimer() {
  clearTimer();
  if (!run || !run.timerSeconds) return;
  const box = document.getElementById("timer");
  const fill = box && box.querySelector(".timer-fill");
  const text = box && box.querySelector(".timer-text");
  const totalMs = run.timerSeconds * 1000;
  timer.deadline = Date.now() + totalMs;
  timer.warned = false;
  const tick = () => {
    const left = Math.max(0, timer.deadline - Date.now());
    const secs = Math.ceil(left / 1000);
    if (fill) fill.style.transform = `scaleX(${left / totalMs})`;
    if (text) text.textContent = `${secs}s left`;
    if (!timer.warned && left > 0 && secs <= CONFIG.TIMER_WARNING_SECONDS) {
      timer.warned = true;
      if (box) box.classList.add("timer-low");
      announce(`${CONFIG.TIMER_WARNING_SECONDS} seconds left.`);
    }
    if (left <= 0) { clearTimer(); submitAnswer(true); }
  };
  tick();
  timer.interval = setInterval(tick, 250);
}

function clearTimer() {
  if (timer.interval) clearInterval(timer.interval);
  timer.interval = null;
}

/* ---------------------------------------------------------------------
   END SCREEN
   --------------------------------------------------------------------- */
function reportGrid(r) {
  const byIndex = new Map(r.results.map(x => [x.queueIndex, x]));
  const rows = ROUND_ORDER.map(domain => {
    const entries = r.queue.map((entry, i) => ({ entry, i })).filter(x => x.entry.item.domain === domain)
      .sort((a, b) => a.entry.item.id.localeCompare(b.entry.item.id));
    if (!entries.length) return null;
    return el("div", { class: "report-row" },
      el("p", { class: "report-domain", text: domain }),
      el("div", { class: "report-cells" }, entries.map(({ entry, i }) => {
        const res = byIndex.get(i);
        const code = res ? resultCode(res) : "–";
        const inner = [el("span", { class: "rcell-id", text: entry.item.id }), el("span", { class: "rcell-code", text: code })];
        const label = `${entry.item.id}: ${res ? statusWord(res) : "not answered"}`;
        if (res && !res.correct) {
          return el("button", { type: "button", class: `rcell rcell-${code.toLowerCase()}`, "aria-label": `${label}. Show explanation.`, onclick: () => openMissed(entry.item.id) }, inner);
        }
        return el("span", { class: `rcell${res ? " rcell-" + code.toLowerCase() : ""}`, role: "img", "aria-label": label }, inner);
      })));
  }).filter(Boolean);
  return el("section", { class: "report", "aria-labelledby": "report-h" },
    el("h3", { id: "report-h", text: "Susceptibility report" }), rows, legend());
}

function openMissed(id) {
  const d = document.getElementById(`missed-${id}`);
  if (!d) return;
  d.open = true;
  d.querySelector("summary").focus();
}

function breakdownTable(caption, firstCol, keys, group, total, labelFn) {
  const row = (label, b, isTotal) => el("tr", {},
    el("th", { scope: "row", text: label }),
    el("td", { class: "num", text: `${b.correct}/${b.attempted}` }),
    el("td", { class: "num" }, `${pctOf(b)}%`, isTotal ? null : el("span", { class: "bar", "aria-hidden": "true" }, el("span", { style: `width:${pctOf(b)}%` }))),
    el("td", { class: "num", text: fmt(b.points) }));
  return el("div", { class: "table-wrap" },
    el("table", {},
      el("caption", { text: caption }),
      el("thead", {}, el("tr", {},
        el("th", { scope: "col", text: firstCol }),
        el("th", { scope: "col", class: "num", text: "Correct" }),
        el("th", { scope: "col", class: "num", text: "Score" }),
        el("th", { scope: "col", class: "num", text: "Points" }))),
      el("tbody", {}, keys.filter(k => group[k]).map(k => row(labelFn(k), group[k], false))),
      el("tfoot", {}, row("Total", total, true))));
}

function missedCard(res) {
  const item = res.item;
  const out = res.outcome;
  const parts = [el("p", { text: item.stem })];
  const yourAnswer = res.timedOut ? "No answer (time ran out)" : out.response;
  if (isMultipleChoice(item)) {
    parts.push(el("p", {}, el("strong", { text: "Your answer: " }), yourAnswer));
    parts.push(el("p", {}, el("strong", { text: "Correct answer: " }), out.correctAnswer));
    parts.push(el("p", {}, el("strong", { text: "Why it's right: " }), item.rationale.correct));
    if (out.chosenIndex !== null) parts.push(el("p", {}, el("strong", { text: "Why your answer is wrong: " }), distractorRationale(item, out.chosenIndex)));
  } else if (item.type === "match") {
    parts.push(el("p", {}, el("strong", { text: "Your result: " }), yourAnswer));
    parts.push(el("p", {}, el("strong", { text: "Correct matches:" })));
    parts.push(el("ul", {}, item.pairs.map((p, i) => el("li", {}, `${out.rowCorrect[i] ? "✓" : "✗"} ${p[0]}: ${p[1]}`))));
    parts.push(el("p", {}, el("strong", { text: "Why: " }), item.rationale.correct));
  } else {
    parts.push(el("p", {}, el("strong", { text: "Your result: " }), yourAnswer));
    parts.push(el("p", {}, el("strong", { text: "Correct order:" })));
    parts.push(el("ol", {}, item.sequence.map(s => el("li", { text: s }))));
    parts.push(el("p", {}, el("strong", { text: "Why: " }), item.rationale.correct));
  }
  parts.push(el("p", {}, el("strong", { text: "Pearl: " }), item.pearl));
  parts.push(sourceBadge(item));
  return el("details", { class: `missed-item${res.fraction > 0 ? " partial" : ""}`, id: `missed-${item.id}` },
    el("summary", {}, el("span", { class: "missed-id", text: item.id }), `${item.domain}: ${truncate(item.stem, 90)}`),
    parts);
}

function buildResultsText(r, t) {
  const meta = session.report.meta;
  const missed = r.results.filter(x => !x.correct);
  const when = new Date().toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
  const lines = [
    `ID topic game results: ${meta.topic || "topic discussion"}`,
    session.learnerName.trim() ? `Learner: ${session.learnerName.trim()}` : null,
    `Handout: ${meta.handout_title || "not set"} (question bank v${meta.version ?? "?"})`,
    `Mode: ${MODE_LABEL[r.mode]} | Timer: ${r.timerSeconds ? r.timerSeconds + " s" : "off"} | ${when}`,
    `Score: ${fmt(t.total.points)} points | ${t.total.correct}/${t.total.attempted} correct (${pctOf(t.total)}%) | Best streak: ${r.bestStreak}`,
    r.endedEarly ? `Ended early after ${t.total.attempted} of ${r.queue.length} questions.` : null,
    "",
    "By domain:",
    ...ROUND_ORDER.filter(d => t.byDomain[d]).map(d => `- ${d}: ${t.byDomain[d].correct}/${t.byDomain[d].attempted} correct, ${fmt(t.byDomain[d].points)} pts`),
    "",
    "By Bloom level:",
    ...BLOOMS.filter(b => t.byBloom[b]).map(b => `- ${cap(b)}: ${t.byBloom[b].correct}/${t.byBloom[b].attempted} correct, ${fmt(t.byBloom[b].points)} pts`),
    "",
    missed.length ? `Missed (${missed.length}):` : "Missed: none",
    ...missed.map(m => {
      const answer = m.timedOut ? "no answer (time ran out)" : isMultipleChoice(m.item) ? `"${m.outcome.response}"` : m.outcome.response;
      const correct = isMultipleChoice(m.item) ? ` | Correct: "${m.outcome.correctAnswer}"` : "";
      return `- ${m.id} (${m.domain}, ${m.bloom}): ${answer}${correct} | Pearl: ${m.item.pearl}`;
    })
  ];
  return lines.filter(l => l !== null).join("\n");
}

async function copyResults(text, status, preview) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (_) { ok = false; }
  if (!ok) {
    /* Fallback for browsers that block the clipboard API on local files. */
    const scratch = el("textarea", { class: "copy-scratch", readonly: true, "aria-hidden": "true", tabindex: "-1" });
    scratch.value = text;
    document.body.append(scratch);
    scratch.select();
    try { ok = typeof document.execCommand === "function" && document.execCommand("copy"); } catch (_) { ok = false; }
    scratch.remove();
  }
  if (ok) {
    status.textContent = "Results copied. Paste them into a message to your preceptor.";
  } else {
    status.textContent = "This browser blocked copying. The results text is shown below; select it and copy.";
    preview.open = true;
    const area = preview.querySelector("textarea");
    area.value = text;
    area.focus();
    area.select();
  }
}

function renderEnd(r) {
  const t = tally(r.results);
  const missed = r.results.filter(x => !x.correct);
  const retryIds = missed.map(x => x.id);

  const status = el("p", { class: "copy-status", role: "status" });
  const previewArea = el("textarea", { readonly: true, "aria-label": "Results text" });
  const preview = el("details", { class: "copy-preview" }, el("summary", { text: "Show results text" }), previewArea);
  preview.addEventListener("toggle", () => { if (preview.open) previewArea.value = buildResultsText(r, t); });
  const nameInput = el("input", { type: "text", id: "learner-name", autocomplete: "name", value: session.learnerName,
    oninput: (e) => { session.learnerName = e.target.value; if (preview.open) previewArea.value = buildResultsText(r, t); } });

  const node = el("section", { class: "screen end" },
    el("header", { class: "end-hero" },
      el("p", { class: "mode-label", text: r.endedEarly ? `${MODE_LABEL[r.mode]}, ended early` : `${MODE_LABEL[r.mode]} complete` }),
      el("h2", { id: "end-h", tabindex: "-1", text: `${t.total.correct} of ${t.total.attempted} correct` }),
      el("p", { class: "end-stats", text: `${fmt(t.total.points)} points. ${pctOf(t.total)}% correct. Best streak ${r.bestStreak}.${r.endedEarly ? ` You answered ${t.total.attempted} of ${r.queue.length} questions.` : ""}` })),
    reportGrid(r),
    talliesConsistent(t) ? null : el("p", { class: "alert", role: "alert", text: "Score breakdown totals don't match the overall score. Please report this to your preceptor." }),
    el("section", { class: "breakdowns", "aria-label": "Score breakdown" },
      breakdownTable("By domain", "Domain", ROUND_ORDER, t.byDomain, t.total, d => d),
      breakdownTable("By Bloom level", "Bloom level", BLOOMS, t.byBloom, t.total, cap)),
    el("section", { class: "missed", "aria-labelledby": "missed-h" },
      el("h3", { id: "missed-h", text: missed.length ? `Missed (${missed.length})` : "Nothing missed" }),
      missed.length ? missed.map(missedCard) : el("p", { text: "Every question you answered was fully correct." })),
    el("div", { class: "field" },
      el("label", { for: "learner-name", text: "Your name for the copied results (optional)" }),
      nameInput),
    el("div", { class: "end-actions" },
      el("button", { type: "button", class: "btn primary", id: "retry-missed", disabled: retryIds.length === 0, onclick: () => startRun("retry", retryIds) },
        retryIds.length ? `Retry missed (${retryIds.length})` : "Retry missed"),
      el("button", { type: "button", class: "btn quiet", id: "copy-results", onclick: () => copyResults(buildResultsText(r, t), status, preview) }, "Copy results"),
      el("button", { type: "button", class: "btn quiet", onclick: () => startRun(r.mode, r.retryIds) }, `Play ${MODE_LABEL[r.mode]} again`),
      el("button", { type: "button", class: "btn quiet", onclick: renderStart }, "Back to menu")),
    status,
    preview);

  run = null;
  setScreen(node, null, node.querySelector("#end-h"));
}

/* ---------------------------------------------------------------------
   RAPID PEARLS (flip cards, not scored)
   --------------------------------------------------------------------- */
function startPearls() {
  deck = { cards: shuffle(session.report.ready), index: 0, flipped: false };
  renderPearlCard();
}

function answerNode(item) {
  if (isMultipleChoice(item)) return el("p", { class: "card-answer", text: item.options[item.answer_index] });
  if (item.type === "match") return el("ul", { class: "card-answer" }, item.pairs.map(p => el("li", { text: `${p[0]}: ${p[1]}` })));
  return el("ol", { class: "card-answer" }, item.sequence.map(s => el("li", { text: s })));
}

function answerText(item) {
  if (isMultipleChoice(item)) return item.options[item.answer_index];
  if (item.type === "match") return item.pairs.map(p => `${p[0]}: ${p[1]}`).join("; ");
  return item.sequence.join(", then ");
}

function renderPearlCard() {
  const d = deck;
  if (d.index >= d.cards.length) { renderDeckDone(); return; }
  const item = d.cards[d.index];
  const last = d.index === d.cards.length - 1;

  const front = el("div", { class: "face face-front" },
    el("ul", { class: "chips" }, el("li", { class: "chip", text: item.domain }), el("li", { class: "chip", text: TYPE_LABEL[item.type] })),
    el("p", { class: "card-stem", text: item.stem }),
    item.type === "match" ? el("ul", { class: "card-lefts" }, item.pairs.map(p => el("li", { text: p[0] }))) : null,
    el("p", { class: "card-hint", text: "Recall your answer, then show the back." }));
  const back = el("div", { class: "face face-back", tabindex: "-1" },
    el("h3", { class: "card-label", text: "Answer" }), answerNode(item),
    el("h3", { class: "card-label", text: "Pearl" }), el("p", { class: "card-pearl", text: item.pearl }),
    sourceBadge(item));
  const inner = el("div", { class: "card-inner" }, front, back);

  const flipBtn = el("button", { type: "button", class: "btn primary", id: "flip", "aria-pressed": "false" }, "Show answer");
  const applyFlip = () => {
    inner.classList.toggle("flipped", d.flipped);
    front.toggleAttribute("inert", d.flipped);
    back.toggleAttribute("inert", !d.flipped);
    front.setAttribute("aria-hidden", String(d.flipped));
    back.setAttribute("aria-hidden", String(!d.flipped));
    flipBtn.textContent = d.flipped ? "Show question" : "Show answer";
    flipBtn.setAttribute("aria-pressed", String(d.flipped));
  };
  const flip = () => {
    d.flipped = !d.flipped;
    applyFlip();
    announce(d.flipped ? `Answer: ${answerText(item)}. Pearl: ${item.pearl}` : "Question side.");
  };
  const go = (delta) => { d.index += delta; d.flipped = false; renderPearlCard(); };
  flipBtn.addEventListener("click", flip);

  const card = el("div", { class: "card" }, inner);
  card.addEventListener("click", (e) => { if (!e.target.closest("a, button, summary, details")) flip(); });

  const node = el("section", { class: "screen pearls" },
    el("header", { class: "topbar" },
      el("div", { class: "topbar-row" },
        el("p", { class: "mode-label", text: "Rapid Pearls" }),
        el("button", { type: "button", class: "btn quiet small", onclick: renderStart }, "Back to menu")),
      el("p", { class: "score", text: `Card ${d.index + 1} of ${d.cards.length}` }),
      el("div", { class: "deck-progress", "aria-hidden": "true" }, el("span", { style: `width:${((d.index + 1) / d.cards.length) * 100}%` }))),
    el("h2", { class: "sr-only", id: "card-h", tabindex: "-1", text: `Card ${d.index + 1} of ${d.cards.length}, ${item.domain}` }),
    card,
    el("div", { class: "deck-controls" },
      el("button", { type: "button", class: "btn quiet", disabled: d.index === 0, onclick: () => go(-1) }, "Previous"),
      flipBtn,
      el("button", { type: "button", class: "btn quiet", id: "next-card", onclick: () => go(1) }, last ? "Finish deck" : "Next card")),
    el("p", { class: "muted", style: "margin-top:.75rem;font-size:.9rem" },
      el("kbd", { text: "Enter" }), " or ", el("kbd", { text: "Space" }), " flips the card. ",
      el("kbd", { text: "←" }), " ", el("kbd", { text: "→" }), " move between cards."));

  applyFlip();
  setScreen(node, (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" && d.index > 0) { e.preventDefault(); go(-1); }
    else if ((e.key === "Enter" || e.key === " ") && !e.target.closest("button, a, summary")) { e.preventDefault(); flip(); }
  }, node.querySelector("#card-h"));
}

function renderDeckDone() {
  const node = el("section", { class: "screen" },
    el("div", { class: "round-intro" },
      el("p", { class: "round-count", text: "Rapid Pearls" }),
      el("h2", { id: "deck-h", tabindex: "-1", text: "Deck reviewed" }),
      el("p", { text: `You went through all ${plural(deck.cards.length, "pearl")}. Test yourself on them next.` }),
      el("div", { class: "actions" },
        el("button", { type: "button", class: "btn primary", onclick: () => startRun("rounds") }, "Start Rounds"),
        el("button", { type: "button", class: "btn quiet", onclick: startPearls }, "Shuffle and review again"),
        el("button", { type: "button", class: "btn quiet", onclick: renderStart }, "Back to menu"))));
  setScreen(node, null, node.querySelector("#deck-h"));
}

/* ---------------------------------------------------------------------
   START
   --------------------------------------------------------------------- */
function init() {
  session.report = validateBank(typeof BANK === "undefined" ? null : BANK);
  const topic = splitTopic(session.report.meta.topic);
  document.title = `${topic.main} | ID topic game`;
  renderStart();
}
init();
</script>
